<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UAVSA · 无人机算法 Harness 平台</title>
<style>
  :root {
    --bg: #F3EFE7;
    --surface: rgba(255, 255, 255, 0.58);
    --surface-strong: rgba(255, 255, 255, 0.76);
    --surface-soft: rgba(250, 247, 240, 0.56);
    --ink: #161513;
    --ink-soft: #6F6A5F;
    --ink-faint: #A39C8F;
    --line: rgba(22, 21, 19, 0.09);
    --line-glass: rgba(255, 255, 255, 0.66);
    --gold: #A8823F;
    --gold-bright: #C79A4B;
    --ok: #2E7D4F;
    --warn: #B0622F;
    --mono: "SF Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
    --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --shadow: 0 10px 30px rgba(22, 21, 19, 0.06);
    --shadow-lg: 0 24px 60px rgba(22, 21, 19, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(1100px 780px at 8% -12%, #FFF8EA 0%, transparent 58%),
      radial-gradient(900px 680px at 98% 6%, #E9F0E6 0%, transparent 54%),
      radial-gradient(760px 620px at 62% 112%, #F4E6D0 0%, transparent 60%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 环境光斑（液态玻璃底色） ===== */
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(46px); opacity: .55;
    will-change: transform;
  }
  .b1 {
    width: 460px; height: 460px; left: -120px; top: 12%;
    background: radial-gradient(circle, rgba(168, 130, 63, .30), transparent 68%);
    animation: drift1 20s ease-in-out infinite alternate;
  }
  .b2 {
    width: 520px; height: 520px; right: -160px; top: -80px;
    background: radial-gradient(circle, rgba(106, 148, 122, .22), transparent 68%);
    animation: drift2 24s ease-in-out infinite alternate;
  }
  .b3 {
    width: 420px; height: 420px; left: 42%; bottom: -180px;
    background: radial-gradient(circle, rgba(214, 178, 120, .26), transparent 68%);
    animation: drift3 28s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate3d(60px, 40px, 0) scale(1.08); } }
  @keyframes drift2 { to { transform: translate3d(-50px, 70px, 0) scale(1.12); } }
  @keyframes drift3 { to { transform: translate3d(-70px, -40px, 0) scale(1.06); } }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  /* ===== 侧栏（玻璃） ===== */
  aside {
    position: relative; z-index: 1;
    width: 288px; min-width: 288px;
    display: flex; flex-direction: column;
    gap: 20px;
    padding: 26px 22px;
    overflow-y: auto;
    background: linear-gradient(165deg, rgba(255, 255, 255, .70), rgba(255, 255, 255, .34));
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    backdrop-filter: blur(28px) saturate(1.4);
    border-right: 1px solid var(--line-glass);
    box-shadow: inset -1px 0 0 rgba(22, 21, 19, .035), 8px 0 40px rgba(22, 21, 19, .03);
  }

  .brand { display: flex; align-items: baseline; padding: 2px 2px 4px; }
  .brand .logo { font-size: 23px; font-weight: 800; letter-spacing: .4px; }
  .brand .logo em { font-style: normal; color: var(--gold); }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-soft); text-transform: uppercase;
  }

  textarea, input[type=text], input[type=password] {
    font-family: var(--sans); font-size: 13px; color: var(--ink);
    background: rgba(255, 255, 255, .62);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(22, 21, 19, .08);
    border-radius: 12px;
    padding: 11px 13px;
    outline: none; resize: vertical;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  textarea::placeholder, input::placeholder { color: var(--ink-faint); }
  textarea:focus, input:focus {
    background: rgba(255, 255, 255, .82);
    border-color: rgba(22, 21, 19, .35);
    box-shadow: 0 0 0 4px rgba(22, 21, 19, .05), var(--shadow);
  }
  textarea { min-height: 92px; line-height: 1.6; }

  .row { display: flex; gap: 8px; align-items: stretch; }
  .row > input { flex: 1; min-width: 0; }

  .btn {
    font-family: var(--sans); font-size: 13px; font-weight: 650;
    border-radius: 12px; cursor: pointer; padding: 12px 14px;
    border: 1px solid transparent;
    transition: transform .16s, box-shadow .16s, opacity .16s, background .16s;
  }
  .btn:active { transform: translateY(1px) scale(.995); }
  .btn-primary {
    color: #fff;
    background: linear-gradient(180deg, #2C2924 0%, #161513 100%);
    box-shadow: 0 10px 24px rgba(22, 21, 19, .22), inset 0 1px 0 rgba(255, 255, 255, .16);
  }
  .btn-primary:hover { box-shadow: 0 14px 30px rgba(22, 21, 19, .26), inset 0 1px 0 rgba(255, 255, 255, .2); }
  .btn-primary:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    color: var(--ink);
    background: rgba(255, 255, 255, .46);
    border-color: rgba(22, 21, 19, .08);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, .78); }
  .btn-sm { padding: 8px 12px; font-size: 12px; border-radius: 10px; }

  .status {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: var(--ink-soft);
    padding: 11px 13px;
    background: rgba(255, 255, 255, .46);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line-glass);
    border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(46, 125, 79, .13); }
  .dot.run { background: var(--gold); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .32; transform: scale(.86); } }

  .badge {
    margin-left: auto;
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    color: var(--ink-soft);
    padding: 3px 8px; border-radius: 999px;
    background: rgba(22, 21, 19, .05);
    border: 1px solid rgba(22, 21, 19, .06);
  }

  #settingsBtn { margin-top: auto; }

  /* ===== 主区 ===== */
  main {
    position: relative; z-index: 1;
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }
  header {
    height: 62px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px;
    background: rgba(255, 255, 255, .34);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    backdrop-filter: blur(22px) saturate(1.3);
    border-bottom: 1px solid var(--line-glass);
  }
  header .title { font-size: 14px; font-weight: 750; letter-spacing: .01em; }
  header .title span { color: var(--ink-faint); font-weight: 500; }
  header .meta { font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono); }

  #stream {
    flex: 1; overflow-y: auto;
    padding: 28px 26px 36px;
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 82%; display: flex; flex-direction: column;
    animation: fade .28s cubic-bezier(.22, .61, .36, 1);
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
    to { opacity: 1; transform: none; }
  }

  .msg.system { align-self: center; max-width: 92%; }
  .msg.system .bubble {
    background: rgba(255, 255, 255, .34);
    border: 1px dashed rgba(22, 21, 19, .14);
    color: var(--ink-soft); font-size: 12px; text-align: center;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: none;
  }

  .bubble {
    padding: 13px 16px;
    border-radius: 16px;
    font-size: 13px; line-height: 1.68;
    background: linear-gradient(155deg, rgba(255, 255, 255, .76), rgba(255, 255, 255, .44));
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    backdrop-filter: blur(20px) saturate(1.35);
    border: 1px solid var(--line-glass);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .9);
    word-break: break-word; white-space: pre-wrap;
  }

  .msg.user { align-self: flex-end; }
  .msg.user .bubble {
    color: #fff;
    background: linear-gradient(155deg, #2B2823, #161513);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 16px 34px rgba(22, 21, 19, .22), inset 0 1px 0 rgba(255, 255, 255, .12);
  }
  .msg.agent { align-self: flex-start; }

  /* 标签独占一行 */
  .tag {
    display: block;
    font-size: 10px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 7px 4px;
  }
  .tag::before {
    content: ""; display: inline-block;
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; margin-right: 7px;
    vertical-align: 1.5px;
    box-shadow: 0 0 0 3px rgba(168, 130, 63, .12);
  }

  .msg.thought .bubble {
    background: linear-gradient(150deg, rgba(252, 247, 236, .86), rgba(255, 255, 255, .48));
    border-left: 3px solid var(--gold);
    color: var(--ink);
  }
  .msg.action .bubble {
    font-family: var(--mono); font-size: 12px;
    background: linear-gradient(150deg, rgba(255, 255, 255, .62), rgba(250, 247, 240, .48));
    border-left: 3px solid var(--gold-bright);
  }
  .msg.action .tool { font-weight: 700; color: var(--ink); }
  .msg.action .args {
    display: block; margin-top: 7px;
    font-size: 11.5px; color: var(--ink-soft);
    white-space: pre-wrap;
  }
  .msg.observation .bubble {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    color: var(--ink-soft);
    background: linear-gradient(155deg, rgba(247, 243, 235, .78), rgba(255, 255, 255, .4));
    max-height: 300px; overflow-y: auto;
  }
  .msg.final .bubble {
    background: linear-gradient(155deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .56));
    border: 1px solid rgba(22, 21, 19, .22);
    box-shadow: 0 18px 40px rgba(22, 21, 19, .1), inset 0 1px 0 rgba(255, 255, 255, .95);
  }
  .msg.final .bubble b { display: block; margin-bottom: 5px; }
  .muted { color: var(--ink-faint); }

  /* ===== 空态 ===== */
  .empty {
    margin: auto; text-align: center; color: var(--ink-faint);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .empty p { font-size: 13px; letter-spacing: .02em; }
  .orb {
    width: 66px; height: 66px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95), transparent 42%),
      linear-gradient(145deg, rgba(255, 255, 255, .72), rgba(168, 130, 63, .18));
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 18px 40px rgba(22, 21, 19, .08), inset 0 1px 6px rgba(255, 255, 255, .9);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    position: relative;
  }
  .orb::after {
    content: ""; position: absolute; inset: 14px;
    border-radius: 50%;
    border: 1px solid rgba(168, 130, 63, .35);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.12); opacity: .5; } }

  /* ===== 设置抽屉 ===== */
  .drawer {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
    background: rgba(22, 21, 19, .22);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .drawer.open { display: flex; }
  .drawer .panel {
    width: 440px; max-width: 92vw;
    background: linear-gradient(160deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, .7));
    -webkit-backdrop-filter: blur(30px) saturate(1.4);
    backdrop-filter: blur(30px) saturate(1.4);
    border: 1px solid var(--line-glass);
    border-radius: 20px;
    padding: 26px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, .95);
  }
  .drawer h3 { font-size: 16px; letter-spacing: .01em; }
  .drawer .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* ===== 滚动条 ===== */
  #stream::-webkit-scrollbar, aside::-webkit-scrollbar,
  .msg.observation .bubble::-webkit-scrollbar { width: 8px; }
  #stream::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb,
  .msg.observation .bubble::-webkit-scrollbar-thumb {
    background: rgba(22, 21, 19, .12); border-radius: 999px;
    border: 2px solid transparent; background-clip: content-box;
  }
  #stream::-webkit-scrollbar-thumb:hover, aside::-webkit-scrollbar-thumb:hover {
    background: rgba(22, 21, 19, .22); background-clip: content-box;
  }

  @media (max-width: 900px) {
    aside { width: 254px; min-width: 254px; padding: 22px 18px; }
    #stream { padding: 22px 18px 30px; }
    header { padding: 0 18px; }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <aside>
    <div class="brand">
      <div class="logo">UAVSA<em>·</em>Harness</div>
    </div>

    <div class="field">
      <label>任务目标</label>
      <textarea id="goal" placeholder="例如：改善 EGO-Planner 在障碍物密集场景的轨迹平滑度"></textarea>
    </div>

    <div class="field">
      <label>算法文件</label>
      <div class="row">
        <input type="text" id="algorithm" placeholder="ego-planner（或选择文件）" />
        <button class="btn btn-ghost btn-sm" id="pickBtn" title="选择文件">选择</button>
      </div>
    </div>

    <button class="btn btn-primary" id="startBtn">开始全流程</button>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
      <span class="badge" id="backendBadge">内置</span>
    </div>

    <button class="btn btn-ghost" id="settingsBtn">⚙ 设置 · API Key</button>
  </aside>

  <main>
    <header>
      <div class="title">对话 <span>/ 自适应纠偏</span></div>
      <div class="meta" id="sessionMeta">—</div>
    </header>
    <div id="stream" aria-live="polite">
      <div class="empty" id="empty">
        <div class="orb"></div>
        <p>输入任务目标，开始自适应纠偏</p>
      </div>
    </div>
  </main>

  <!-- 设置抽屉 -->
  <div class="drawer" id="drawer">
    <div class="panel">
      <h3>设置</h3>
      <div class="field">
        <label>LLM API Key</label>
        <input type="password" id="cfgKey" placeholder="sk-..." />
      </div>
      <div class="field">
        <label>模型</label>
        <input type="text" id="cfgModel" placeholder="deepseek-v4-pro" />
      </div>
      <div class="field">
        <label>Base URL</label>
        <input type="text" id="cfgBase" placeholder="https://api.deepseek.com" />
      </div>
      <div class="field">
        <label>Agent 地址</label>
        <input type="text" id="cfgAgent" placeholder="留空 = 内置；填 http://127.0.0.1:8000 连接服务" />
      </div>
      <div class="foot">
        <button class="btn btn-ghost" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);

// ---- pywebview 桥（浏览器预览时回退到 localStorage） ----
const bridge = window.pywebview ? window.pywebview.api : null;

async function loadConfig() {
  if (bridge) return await bridge.get_config();
  const raw = localStorage.getItem("uavsa_cfg");
  return raw ? JSON.parse(raw) : { llm_api_key: "", llm_model: "deepseek-v4-pro", llm_base_url: "https://api.deepseek.com", agent_url: "" };
}
async function saveConfig(cfg) {
  if (bridge) return await bridge.save_config(cfg);
  localStorage.setItem("uavsa_cfg", JSON.stringify(cfg));
}
async function agentUrl() {
  if (bridge) return await bridge.get_agent_url();
  const cfg = await loadConfig();
  return cfg.agent_url || "http://127.0.0.1:8000";
}

let cfg = null;
let running = false;
let ws = null;

function setStatus(text, cls) {
  $("#statusText").textContent = text;
  $("#statusDot").className = "dot " + (cls || "");
}
function setBackend(url) {
  $("#backendBadge").textContent = url ? "远程" : "内置";
}
function appendMsg(kind, inner) {
  const empty = $("#empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.innerHTML = inner;
  $("#stream").appendChild(el);
  $("#stream").scrollTop = $("#stream").scrollHeight;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function pretty(o) { return JSON.stringify(o, null, 2); }

function renderEvent(ev) {
  switch (ev.type) {
    case "start":
      appendMsg("system", `<div class="bubble">会话 <b>${esc(ev.session_id)}</b> 已启动<br/><span class="muted">${esc(ev.goal)}</span></div>`);
      $("#sessionMeta").textContent = ev.session_id || "—";
      break;
    case "log":
      appendMsg("system", `<div class="bubble">${esc(ev.content)}</div>`);
      break;
    case "thought":
      appendMsg("thought", `<div class="tag">思考</div><div class="bubble">${esc(ev.content)}</div>`);
      break;
    case "action":
      appendMsg("action", `<div class="tag">调用工具</div><div class="bubble"><span class="tool">${esc(ev.tool)}</span><span class="args">${esc(pretty(ev.input))}</span></div>`);
      break;
    case "observation":
      appendMsg("observation", `<div class="tag">返回</div><div class="bubble">${esc(pretty(ev.result))}</div>`);
      break;
    case "final":
      appendMsg("final", `<div class="tag">完成</div><div class="bubble">${esc(ev.content)}${ev.patch_summary ? `\n\n补丁要点：${esc(ev.patch_summary)}` : ""}</div>`);
      break;
    case "done":
      running = false; $("#startBtn").disabled = false;
      setStatus("已完成", "on");
      break;
  }
}

async function start() {
  if (running) return;
  const goal = $("#goal").value.trim();
  if (!goal) { setStatus("请填写任务目标", ""); return; }
  cfg = await loadConfig();
  const url = await agentUrl();
  running = true;
  $("#startBtn").disabled = true;
  setStatus("运行中…", "run");

  const body = {
    goal,
    algorithm: $("#algorithm").value.trim() || "ego-planner",
    llm_api_key: cfg.llm_api_key || undefined,
    llm_model: cfg.llm_model || undefined,
  };
  try {
    const r = await fetch(url + "/session", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!data.session_id) throw new Error(JSON.stringify(data));
    appendMsg("user", `<div class="bubble">${esc(goal)}</div>`);
    openStream(url, data.session_id);
  } catch (e) {
    running = false; $("#startBtn").disabled = false;
    setStatus("连接失败", "");
    appendMsg("system", `<div class="bubble">无法连接 Agent（${esc(e.message)}）。请确认服务已启动。</div>`);
  }
}

function openStream(url, sid) {
  const wsBase = url.replace(/^http/, "ws");
  ws = new WebSocket(`${wsBase}/session/${sid}/stream`);
  ws.onmessage = (m) => { const ev = JSON.parse(m.data); renderEvent(ev); };
  ws.onerror = () => setStatus("流连接中断", "");
  ws.onclose = () => { if (running) { running = false; $("#startBtn").disabled = false; setStatus("已结束", "on"); } };
}

function openDrawer() { $("#drawer").classList.add("open"); }
function closeDrawer() { $("#drawer").classList.remove("open"); }

(async function init() {
  cfg = await loadConfig();
  $("#cfgKey").value = cfg.llm_api_key || "";
  $("#cfgModel").value = cfg.llm_model || "deepseek-v4-pro";
  $("#cfgBase").value = cfg.llm_base_url || "https://api.deepseek.com";
  $("#cfgAgent").value = cfg.agent_url || "";
  setBackend(cfg.agent_url);
  setStatus("就绪", "on");

  $("#startBtn").addEventListener("click", start);
  $("#settingsBtn").addEventListener("click", openDrawer);
  $("#cancelBtn").addEventListener("click", closeDrawer);
  $("#drawer").addEventListener("click", (e) => { if (e.target === $("#drawer")) closeDrawer(); });
  $("#pickBtn").addEventListener("click", async () => {
    if (bridge && bridge.pick_file) { const p = await bridge.pick_file(); if (p) $("#algorithm").value = p; }
    else { $("#algorithm").value = "ego-planner"; }
  });
  $("#saveBtn").addEventListener("click", async () => {
    cfg = await loadConfig();
    cfg.llm_api_key = $("#cfgKey").value.trim();
    cfg.llm_model = $("#cfgModel").value.trim() || "deepseek-v4-pro";
    cfg.llm_base_url = $("#cfgBase").value.trim() || "https://api.deepseek.com";
    cfg.agent_url = $("#cfgAgent").value.trim();
    await saveConfig(cfg);
    setBackend(cfg.agent_url);
    closeDrawer();
    setStatus("设置已保存", "on");
  });
})();
</script>
